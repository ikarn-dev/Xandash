name: Sync Node Pings Data

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-mainnet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Sync mainnet pings to MongoDB
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://xandash.vercel.app/api/sync-pings?network=mainnet" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response: $body"
          echo "Status: $http_code"
          
          if [ "$http_code" != "200" ]; then
            echo "Mainnet ping sync failed with status $http_code"
            exit 1
          fi
          
          echo "✅ Mainnet ping sync completed successfully"
